<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | Towskan</title>
    <meta name="description" content="Inicia sesión en Towskan para pedir las mejores hamburguesas y comida rápida gourmet de la ciudad.">
    <meta property="og:title" content="Iniciar Sesión | Towskan">
    <meta property="og:description" content="Accede a tu cuenta y disfruta de la mejor comida rápida gourmet.">
    <meta property="og:type" content="website">

    <!-- Bootstrap 5 & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Towskan Styles -->
    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="stylesheet" href="assets/css/sesion.css">
</head>

<body>
    <!-- Botón Volver -->
    <a href="index.html" class="btn-volver" aria-label="Volver a la página principal">
        <i class="bi bi-arrow-left"></i>
        <span>Volver</span>
    </a>

    <div class="auth-container">
        <!-- Lado Izquierdo (Presentación) -->
        <div class="auth-left">
            <div class="auth-logo">
                <i class="bi bi-fire"></i> Towskan
            </div>
            <h1>Bienvenido de nuevo</h1>
            <p>
                Inicia sesión para pedir tus hamburguesas favoritas, acumular puntos y recibir tus pedidos a la velocidad de la luz.
            </p>
        </div>

        <!-- Lado Derecho (Formulario) -->
        <div class="auth-right">
            <h2>Iniciar sesión</h2>
            <p class="auth-subtitle">Ingresa tus datos para continuar</p>

            <form id="loginForm" novalidate>
                <!-- Email -->
                <div class="form-group-towskan">
                    <label for="email">Correo electrónico</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        class="form-control-towskan"
                        placeholder="ejemplo@correo.com"
                        required
                        autocomplete="email"
                    >
                </div>

                <!-- Contraseña -->
                <div class="form-group-towskan">
                    <label for="password">Contraseña</label>
                    <div class="position-relative">
                        <input
                            type="password"
                            id="password"
                            name="password"
                            class="form-control-towskan pe-5"
                            placeholder="Ingresa tu contraseña"
                            required
                            autocomplete="current-password"
                        >
                        <button
                            type="button"
                            class="btn position-absolute top-50 end-0 translate-middle-y me-2 p-0 text-muted border-0 bg-transparent"
                            id="togglePassword"
                            style="min-height: 38px; min-width: 38px;"
                            aria-label="Mostrar u ocultar contraseña"
                        >
                            <i class="bi bi-eye" id="togglePasswordIcon"></i>
                        </button>
                    </div>
                </div>

                <!-- Opciones -->
                <div class="auth-options">
                    <label class="remember">
                        <input type="checkbox" id="rememberMe" style="accent-color: var(--primary);">
                        <span>Recordarme</span>
                    </label>
                    <a href="#" class="forgot" id="forgotPasswordLink">¿Olvidaste tu contraseña?</a>
                </div>

                <!-- Botón Submit -->
                <button type="submit" class="btn-auth-submit">
                    <i class="bi bi-box-arrow-in-right me-2"></i> Iniciar sesión
                </button>
            </form>

            <div class="auth-divider">O continúa con</div>

            <!-- Google OAuth Demo -->
            <button type="button" class="btn-google-auth" id="googleBtn">
                <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
                    <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/>
                    <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.33 24 12 24z"/>
                    <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 9.98 0 12s.45 3.82 1.25 5.42l4.03-3.15z"/>
                    <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
                </svg>
                <span>Continuar con Google</span>
            </button>

            <!-- Registro -->
            <div class="auth-footer-link">
                ¿No tienes una cuenta? <a href="registro.html">Crear cuenta gratis</a>
            </div>
        </div>
    </div>

    <!-- Scripts Modulares -->
    <script type="module">
        import { handleLogin, handleGoogleAuth } from './assets/js/auth.js';
        import { showAlert } from './assets/js/ui.js';

        document.getElementById('loginForm').addEventListener('submit', handleLogin);
        document.getElementById('googleBtn').addEventListener('click', handleGoogleAuth);

        // Password visibility toggle
        const toggleBtn = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');
        const toggleIcon = document.getElementById('togglePasswordIcon');

        toggleBtn.addEventListener('click', () => {
            const isPassword = passwordInput.getAttribute('type') === 'password';
            passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
            toggleIcon.className = isPassword ? 'bi bi-eye-slash' : 'bi bi-eye';
        });

        document.getElementById('forgotPasswordLink').addEventListener('click', (e) => {
            e.preventDefault();
            showAlert({
                title: 'Recuperar Contraseña',
                message: 'Para restablecer tu contraseña en modo demo, crea una nueva cuenta en Registro o contáctanos a soporte@towskan.com.',
                type: 'info'
            });
        });
    </script>
</body>

</html>
